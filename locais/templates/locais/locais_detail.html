
{% extends 'base.html' %}

{% block title %}Detalhes do Local | Saúde Conectada{% endblock %}

{% block content %}
<section style="background:#c6f4d6; min-height:100vh; padding:40px 6%;">

    <h1 style="color:#2d6a4f;">{{ local.nome }}</h1>

    <div style="background:white; padding:30px; border-radius:10px;">
        <p><strong>Endereço:</strong> {{ local.endereco }}</p>
        <p><strong>Cidade:</strong> {{ local.cidade }}</p>

        <a class="botao" style="background:#2d6a4f; color:white;
           padding:10px 20px; border-radius:5px; text-decoration:none;"
           href="{% url 'locais:editar_local' local.pk %}">
            Editar
        </a>

        <a class="botao" style="background:#2d6a4f; color:white;
           padding:10px 20px; border-radius:5px; text-decoration:none;"
           href="{% url 'locais:locais' %}">
            Voltar
        </a>
    </div>
</section>
{% endblock %}
