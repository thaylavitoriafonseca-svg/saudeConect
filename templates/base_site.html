
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://pt.pngtree.com/freepng/cute-vaccine-vial-and-syringe-cartoon-clipart_20003485.html" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
 <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{% static 'css/home.css' %}">

    <title>
        {% block title %}
        Saúde Conectada
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'principal/css/layout_site.css' %}?v=1">
</head>

<body>

<header>
    <nav class="navbar">


            <div class="logo">
                Saúde<span>Conectada</span>
            </div>

            <div class="menu">

                <a href="{% url 'principal:home' %}">
                    Início
                </a>

                <a href="{% url 'principal:vacinas' %}">
                    Vacinas
                </a>

                <a href="{% url 'principal:campanhas' %}">
                    Campanhas
                </a>

                <a href="{% url 'principal:locais' %}">
                    Locais
                </a>


        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sair</button>
            </form>

        {% else  %}
            <a href="{% url 'login' %}">
                    Login
                </a>
        {% endif %}
            </div>
    </nav>
</header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Saúde Conectada © 2026</p>
        <p>Informação sobre vacinação para todos.</p>
    </footer>

</body>

</html>
