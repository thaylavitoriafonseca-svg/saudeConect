{% extends "base_site.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
    <h2>Entrar</h2>
    {% if form.errors %}
        <p style="color: red;">Usuário ou senha inválidos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>

<p>
    Ainda não tem uma conta?
   <a href="{% url 'usuarios:cadastro' %}">Cadastre-se</a>
</p>

    </form>
{% endblock %}
