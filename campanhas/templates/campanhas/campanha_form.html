{% extends 'base.html' %}

{% block title %} Salvar Campanha | Saúde Conectada {% endblock %}

{% block content %}
<section class="pagina" style="padding: 20px; max-width: 600px; margin: 0 auto;">
    <div class="titulo-pagina">
        <h1>{% if view.kwargs.pk %}Editar{% else %}Cadastrar{% endif %} Campanha</h1>
    </div>

    <div style="background: rgba(255, 255, 255, 0.8); padding: 20px; border-radius: 8px; margin-top: 20px;">
        <!-- O formulário agora envolve os campos E as ações (botões) -->
        <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            {{ form.as_p }}

            <!-- Container dos botões alinhados -->
            <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                <!-- Botão Salvar (agora funciona pois está dentro do form) -->
                <button type="submit" class="botao" style="background-color: #1a5c38; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: sans-serif; font-size: 14px; text-align: center; width: 100px; height: 38px; box-sizing: border-box; line-height: 38px;">
                    Salvar
                </button>

                <!-- Botão Cancelar -->
                <a href="{% url 'campanhas:campanhas' %}" style="background-color: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: sans-serif; font-size: 14px; text-align: center; text-decoration: none; width: 100px; height: 38px; box-sizing: border-box; display: inline-block; line-height: 38px;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
